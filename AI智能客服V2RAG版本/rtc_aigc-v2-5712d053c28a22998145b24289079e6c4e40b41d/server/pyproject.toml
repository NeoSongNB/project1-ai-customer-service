[project]
name = "rtc-aigc-demo-server"
version = "1.0.0"
description = "Local FastAPI server for the RTC AIGC demo"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "volcengine-python-sdk[ark]>=5.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
